# /etc/nginx/conf.d/rice-relay.conf
# 作用：把 https://your-domain.com/api/... 反代到本机 9000 端口的中转服务
# 注意：小程序只认 https + 已备案域名，http 会被拒

server {
    listen 80;
    server_name your-domain.com;
    # 阿里云免费证书续期用得上；证书装好后 http 一律跳 https
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    # 证书：阿里云「数字证书管理服务」下载 Nginx 版，或 certbot 签发
    ssl_certificate     /etc/nginx/ssl/your-domain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 小程序上传的图片可能几 MB，别用默认的 1M
    client_max_body_size 30m;
    client_body_timeout 120s;

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;      # 大图直传，不落临时文件
    }

    # 顺便把健康检查暴露出去，方便部署后自检
    location = /api/ping { proxy_pass http://127.0.0.1:9000/api/ping; }
}
